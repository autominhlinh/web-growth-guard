name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build
      - run: python -m build
      - run: python tools/release_check.py --root . --wheel dist/*.whl --output "$RUNNER_TEMP/wgg-release"
      - run: python -m pip install dist/*.whl
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python examples/demo_regression.py
      - run: python examples/demo_portfolio.py --output "$RUNNER_TEMP/wgg-portfolio"
      - run: python examples/demo_growth.py --output "$RUNNER_TEMP/wgg-growth"
      - run: python examples/demo_intelligence.py --output "$RUNNER_TEMP/wgg-intelligence"
      - run: python examples/demo_analytics.py --output "$RUNNER_TEMP/wgg-analytics"
  sdk-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install . 'mcp>=1.28,<2'
      - run: python examples/sdk_smoke.py
